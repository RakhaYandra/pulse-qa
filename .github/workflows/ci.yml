name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Newman collection is valid + every request asserted
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('collection.json'))
          bad = [i['name'] for i in d['item']
                 if not any(e.get('listen') == 'test' for e in i.get('event', []))]
          assert len(d['item']) >= 20, f"only {len(d['item'])} requests"
          assert not bad, f"unasserted: {bad}"
          print(f"collection OK: {len(d['item'])} asserted requests")
          EOF
      - name: Bench scripts parse
        run: |
          bash -n bench/run.sh
          echo "run.sh OK (stub is Go, vetted in pulse repo)"
      - name: Playwright spec compiles
        run: |
          grep -c "test(" e2e/tests/pulse.spec.ts
